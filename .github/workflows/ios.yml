name: Build IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Generate Xcode project
        run: xcodegen

      - name: Build for Simulator
        run: |
          xcodebuild clean build \
            -project ipaCamera.xcodeproj \
            -scheme ipaCamera \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.5' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: Package .app
        run: |
          APP_PATH="./build/Build/Products/Release-iphonesimulator/ipaCamera.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ 未找到 .app，实际构建产物目录内容如下："
            find ./build/Build/Products -maxdepth 3 -type d
            exit 1
          fi

          echo "✅ 找到 .app：$APP_PATH"
          mkdir -p "${{ runner.temp }}/ipaCamera"
          cp -R "$APP_PATH" "${{ runner.temp }}/ipaCamera/"
          cd "${{ runner.temp }}/ipaCamera"
          zip -r ipaCamera-simulator.zip ipaCamera.app
          echo "✅ 打包完成：$(ls -lh ipaCamera-simulator.zip)"

      - name: Upload Simulator App
        uses: actions/upload-artifact@v7
        with:
          name: ipaCamera-simulator
          path: ${{ runner.temp }}/ipaCamera/ipaCamera-simulator.zip
          if-no-files-found: error
